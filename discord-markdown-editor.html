<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur Markdown Discord — Temps Réel</title>

  <!-- ===================================================================== -->
  <!--  DÉPENDANCES VIA CDN (aucune installation nécessaire)                  -->
  <!--  - Tailwind CSS : design / utilitaires                                -->
  <!--  - Highlight.js : coloration syntaxique des blocs de code             -->
  <!-- ===================================================================== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    // Configuration de la palette de couleurs officielle Discord dans Tailwind
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "discord-chat": "#313338",      // Fond de la zone de chat
            "discord-editor": "#2b2d31",    // Fond de l'éditeur
            "discord-sidebar": "#1e1f22",   // Barres latérales / en-têtes
            "discord-text": "#dbdee1",      // Texte principal
            "discord-muted": "#949ba4",     // Texte secondaire / atténué
            "discord-blurple": "#5865f2",   // Couleur de marque Discord
            "discord-link": "#00a8fc",      // Liens
            "discord-mention": "#3c4270",   // Fond des mentions bleues
            "discord-mention-text": "#c9cdfb",
          },
          fontFamily: {
            // Police officielle de Discord (gg sans n'étant pas publique, on utilise un fallback fidèle)
            discord: ['"Helvetica Neue"', "Helvetica", "Arial", "sans-serif"],
            mono: ['"Consolas"', '"Courier New"', "monospace"],
          },
        },
      },
    };
  </script>

  <style>
    /* ================================================================= */
    /*  STYLES PERSONNALISÉS POUR LE RENDU FIDÈLE À DISCORD              */
    /* ================================================================= */

    /* --- Barre de défilement façon Discord --- */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }

    /* --- SPOILERS cliquables --- */
    .discord-spoiler {
      background-color: #111214;   /* Fond noir très sombre masquant le texte */
      color: transparent;
      border-radius: 4px;
      padding: 0 2px;
      cursor: pointer;
      transition: background-color 0.1s ease;
      user-select: none;
    }
    .discord-spoiler:hover { background-color: #1a1b1e; }
    /* Une fois révélé (classe ajoutée au clic) */
    .discord-spoiler.revealed {
      background-color: rgba(255, 255, 255, 0.1);
      color: inherit;
      cursor: text;
      user-select: text;
    }

    /* --- BLOCS DE CODE multilignes --- */
    .discord-codeblock {
      background-color: #1e1f22;
      border: 1px solid #2b2d31;
      border-radius: 6px;
      margin: 6px 0;
      overflow: hidden;
      font-size: 0.85rem;
    }
    /* Petite barre d'en-tête grise indiquant le langage détecté */
    .discord-codeblock-header {
      background-color: #2b2d31;
      color: #949ba4;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-bottom: 1px solid #1a1b1e;
      font-family: "Consolas", monospace;
    }
    .discord-codeblock pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
    }
    .discord-codeblock code {
      background: transparent !important;
      padding: 0 !important;
      font-family: "Consolas", "Courier New", monospace;
    }

    /* --- CODE EN LIGNE --- */
    .discord-inline-code {
      background-color: #1e1f22;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 0.85em;
      font-family: "Consolas", "Courier New", monospace;
    }

    /* --- CITATIONS (blockquotes) --- */
    .discord-blockquote {
      display: flex;
      padding: 0 8px 0 12px;
      margin: 2px 0;
      position: relative;
    }
    .discord-blockquote::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background-color: #4e5058;
      border-radius: 4px;
    }

    /* --- TITRES (Headers) --- */
    .discord-h1 { font-size: 1.5rem; font-weight: 700; margin: 8px 0 4px; line-height: 1.3; }
    .discord-h2 { font-size: 1.25rem; font-weight: 700; margin: 8px 0 4px; line-height: 1.3; }
    .discord-h3 { font-size: 1.0rem; font-weight: 700; margin: 8px 0 4px; line-height: 1.3; }

    /* --- LISTES --- */
    .discord-list { margin: 4px 0; padding-left: 24px; }
    .discord-list-ul { list-style-type: disc; }
    .discord-list-ol { list-style-type: decimal; }
    .discord-list li { margin: 2px 0; }

    /* --- MENTIONS & BADGES --- */
    .discord-mention {
      background-color: rgba(88, 101, 242, 0.3);
      color: #c9cdfb;
      border-radius: 4px;
      padding: 0 2px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .discord-mention:hover { background-color: rgba(88, 101, 242, 0.6); }
    /* Mentions globales @everyone / @here : fond rouge transparent */
    .discord-mention-global {
      background-color: rgba(240, 71, 71, 0.18);
      color: #f23f43;
      border-radius: 4px;
      padding: 0 2px;
      font-weight: 500;
    }

    /* --- TIMESTAMPS --- */
    .discord-timestamp {
      background-color: rgba(88, 101, 242, 0.15);
      border-radius: 4px;
      padding: 0 3px;
      cursor: default;
    }

    /* --- Animation de la bannière Nitro --- */
    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    .animate-slide-down { animation: slideDown 0.25s ease-out; }

    /* Empêche le textarea de casser le layout */
    textarea { resize: none; }
  </style>
</head>

  <script>
    "use strict";

    /* === Références DOM === */
    const editor       = document.getElementById("editor");
    const preview      = document.getElementById("preview");
    const charCounter  = document.getElementById("char-counter");
    const nitroBanner  = document.getElementById("nitro-banner");
    const truncateBtn  = document.getElementById("truncate-btn");
    const usernameInput= document.getElementById("username-input");
    const avatarInput  = document.getElementById("avatar-input");
    const previewUser  = document.getElementById("preview-username");
    const previewAvatar= document.getElementById("preview-avatar");
    const MAX_CHARS    = 2000;

    /* ===================================================================== */
    /*  UTILITAIRE : ÉCHAPPEMENT HTML (Sécurité XSS — Étape 1)               */
    /* ===================================================================== */
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /* ===================================================================== */
    /*  UTILITAIRE : TRADUCTION DES TIMESTAMPS DISCORD EN FRANÇAIS           */
    /* ===================================================================== */
    function formatTimestamp(unixSeconds, format) {
      const date = new Date(unixSeconds * 1000);
      if (isNaN(date.getTime())) return "(timestamp invalide)";

      // Options de formatage français
      const optsDate     = { day: "numeric", month: "long", year: "numeric" };
      const optsDateShort= { day: "2-digit", month: "2-digit", year: "numeric" };
      const optsTime     = { hour: "2-digit", minute: "2-digit" };
      const optsTimeLong = { hour: "2-digit", minute: "2-digit", second: "2-digit" };
      const optsFull     = { weekday: "long", day: "numeric", month: "long", year: "numeric" };

      switch (format) {
        case "t": // Heure courte : 12:00
          return date.toLocaleTimeString("fr-FR", optsTime);
        case "T": // Heure longue : 12:00:00
          return date.toLocaleTimeString("fr-FR", optsTimeLong);
        case "d": // Date courte : 31/12/2024
          return date.toLocaleDateString("fr-FR", optsDateShort);
        case "D": // Date longue : 31 décembre 2024
          return date.toLocaleDateString("fr-FR", optsDate);
        case "f": // Date + heure : 31 décembre 2024 12:00
          return date.toLocaleDateString("fr-FR", optsDate) + " " + date.toLocaleTimeString("fr-FR", optsTime);
        case "F": // Complet : mardi 31 décembre 2024 12:00
          return date.toLocaleDateString("fr-FR", optsFull) + " " + date.toLocaleTimeString("fr-FR", optsTime);
        case "R": // Relatif : "il y a 2 heures" / "dans 1 an"
          return formatRelativeTime(date);
        default:
          return date.toLocaleString("fr-FR");
      }
    }

    /* Calcul d'un temps relatif lisible en français */
    function formatRelativeTime(date) {
      const diffMs = date.getTime() - Date.now();
      const rtf = new Intl.RelativeTimeFormat("fr", { numeric: "auto" });
      const absSec = Math.abs(diffMs) / 1000;

      // On choisit l'unité la plus pertinente
      const units = [
        { unit: "year",   secs: 31536000 },
        { unit: "month",  secs: 2592000  },
        { unit: "day",    secs: 86400    },
        { unit: "hour",   secs: 3600     },
        { unit: "minute", secs: 60       },
        { unit: "second", secs: 1        },
      ];

      for (const { unit, secs } of units) {
        if (absSec >= secs || unit === "second") {
          const value = Math.round(diffMs / 1000 / secs);
          return rtf.format(value, unit);
        }
      }
      return rtf.format(0, "second");
    }

    /* ===================================================================== */
    /*  PARSEUR MARKDOWN DISCORD                                             */
    /*  L'ordre des opérations est CRUCIAL pour éviter les conflits de regex */
    /* ===================================================================== */
    function parseDiscordMarkdown(raw) {
      // --- ÉTAPE 1 : Échappement HTML complet (sécurité XSS) ---
      let text = escapeHtml(raw);

      // Tableaux de stockage pour les placeholders
      const codeBlocks  = [];
      const inlineCodes = [];

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 2 : Extraction & protection des BLOCS DE CODE (```)         */
      /*  On les remplace par un placeholder __CODE_BLOCK_X__               */
      /* ----------------------------------------------------------------- */
      text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
        const index = codeBlocks.length;
        // Nettoyage du code (suppression du saut de ligne final éventuel)
        const cleanCode = code.replace(/\n$/, "");
        let highlighted, detectedLang;

        try {
          if (lang && hljs.getLanguage(lang)) {
            // Langage explicitement fourni et reconnu
            highlighted  = hljs.highlight(cleanCode, { language: lang }).value;
            detectedLang = lang;
          } else {
            // Détection automatique du langage
            const auto   = hljs.highlightAuto(cleanCode);
            highlighted  = auto.value;
            detectedLang = auto.language || "texte";
          }
        } catch (e) {
          // En cas d'erreur : on affiche le code brut échappé
          highlighted  = cleanCode;
          detectedLang = lang || "texte";
        }

        // Construction du HTML du bloc de code (en-tête grise + code coloré)
        const html =
          `<div class="discord-codeblock">` +
            `<div class="discord-codeblock-header">${detectedLang}</div>` +
            `<pre><code class="hljs">${highlighted}</code></pre>` +
          `</div>`;

        codeBlocks.push(html);
        return `\u0000CODE_BLOCK_${index}\u0000`; // placeholder protégé
      });

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 3 : Extraction & protection des CODES EN LIGNE (`)          */
      /* ----------------------------------------------------------------- */
      text = text.replace(/`([^`\n]+?)`/g, (match, code) => {
        const index = inlineCodes.length;
        inlineCodes.push(`<span class="discord-inline-code">${code}</span>`);
        return `\u0000INLINE_CODE_${index}\u0000`;
      });

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 4 : CITATIONS                                               */
      /*  - Citation globale : >>> (tout ce qui suit est cité)             */
      /*  - Citation simple  : > (sur une seule ligne)                     */
      /* ----------------------------------------------------------------- */

      // Citation globale >>>  (multiligne, jusqu'à la fin)
      text = text.replace(/^&gt;&gt;&gt; ([\s\S]*)$/m, (match, content) => {
        return `<div class="discord-blockquote"><div>${content}</div></div>`;
      });

      // Citations sur une ligne : on regroupe les lignes consécutives
      text = text.replace(/(?:^&gt; ?.*(?:\n|$))+/gm, (block) => {
        const content = block
          .split("\n")
          .filter((l) => l.length > 0)
          .map((l) => l.replace(/^&gt; ?/, ""))
          .join("\n");
        return `<div class="discord-blockquote"><div>${content}</div></div>\n`;
      });

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 5 : STYLES DE TEXTE EN LIGNE (par ordre de priorité)        */
      /* ----------------------------------------------------------------- */

      // Gras + Italique : ***texte***
      text = text.replace(/\*\*\*([\s\S]+?)\*\*\*/g, "<strong><em>$1</em></strong>");
      // Gras : **texte**
      text = text.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
      // Souligné : __texte__
      text = text.replace(/__([\s\S]+?)__/g, "<u>$1</u>");
      // Italique : *texte*
      text = text.replace(/\*([^\*\n]+?)\*/g, "<em>$1</em>");
      // Italique : _texte_ (aux frontières de mots uniquement)
      text = text.replace(/\b_([^_\n]+?)_\b/g, "<em>$1</em>");
      // Barré : ~~texte~~
      text = text.replace(/~~([\s\S]+?)~~/g, "<del>$1</del>");
      // Spoilers : ||texte|| (cliquables)
      text = text.replace(/\|\|([\s\S]+?)\|\|/g, '<span class="discord-spoiler">$1</span>');

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 6 : TITRES (Headers) en début de ligne                     */
      /* ----------------------------------------------------------------- */
      text = text.replace(/^### (.+)$/gm, '<div class="discord-h3">$1</div>');
      text = text.replace(/^## (.+)$/gm,  '<div class="discord-h2">$1</div>');
      text = text.replace(/^# (.+)$/gm,   '<div class="discord-h1">$1</div>');

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 7 : LISTES (puces et numérotées)                           */
      /* ----------------------------------------------------------------- */

      // Listes à puces : lignes commençant par "- " ou "* "
      text = text.replace(/(?:^[ \t]*[-*] .*(?:\n|$))+/gm, (block) => {
        const items = block
          .trim()
          .split("\n")
          .map((l) => l.replace(/^[ \t]*[-*] /, ""))
          .map((l) => `<li>${l}</li>`)
          .join("");
        return `<ul class="discord-list discord-list-ul">${items}</ul>\n`;
      });

      // Listes numérotées : lignes commençant par "1. ", "2. ", etc.
      text = text.replace(/(?:^[ \t]*\d+\. .*(?:\n|$))+/gm, (block) => {
        const items = block
          .trim()
          .split("\n")
          .map((l) => l.replace(/^[ \t]*\d+\. /, ""))
          .map((l) => `<li>${l}</li>`)
          .join("");
        return `<ol class="discord-list discord-list-ol">${items}</ol>\n`;
      });

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 8 : MENTIONS & BADGES DISCORD                              */
      /*  Rappel : "<" et ">" ont été échappés en &lt; et &gt;            */
      /* ----------------------------------------------------------------- */

      // Rôles : <@&role>  ->  @role (rôle)
      text = text.replace(/&lt;@&amp;([^&\s]+?)&gt;/g,
        '<span class="discord-mention">@$1 (rôle)</span>');
      // Salons : <#salon>  ->  #salon
      text = text.replace(/&lt;#([^&\s]+?)&gt;/g,
        '<span class="discord-mention">#$1</span>');
      // Utilisateurs : <@username>  ->  @username
      text = text.replace(/&lt;@([^&\s]+?)&gt;/g,
        '<span class="discord-mention">@$1</span>');

      // Mentions globales : @everyone et @here (badge rouge transparent)
      text = text.replace(/@everyone/g, '<span class="discord-mention-global">@everyone</span>');
      text = text.replace(/@here/g,     '<span class="discord-mention-global">@here</span>');

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 9 : TIMESTAMPS DYNAMIQUES <t:TIMESTAMP:FORMAT>             */
      /* ----------------------------------------------------------------- */
      text = text.replace(/&lt;t:(\d+)(?::([tTdDfFR]))?&gt;/g, (match, ts, fmt) => {
        const formatted = formatTimestamp(parseInt(ts, 10), fmt || "f");
        return `<span class="discord-timestamp" title="Format : ${fmt || "f"}">${formatted}</span>`;
      });

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 10 : RESTAURATION des codes en ligne et blocs de code      */
      /*  On réinjecte les placeholders mis de côté.                       */
      /* ----------------------------------------------------------------- */
      text = text.replace(/\u0000INLINE_CODE_(\d+)\u0000/g, (m, i) => inlineCodes[+i]);
      text = text.replace(/\u0000CODE_BLOCK_(\d+)\u0000/g,  (m, i) => codeBlocks[+i]);

      /* ----------------------------------------------------------------- */
      /*  ÉTAPE 11 : SAUTS DE LIGNE                                        */
      /*  On transforme les \n restants en <br>, SAUF juste après un       */
      /*  bloc de structure fermé (titres, listes, citations, code).       */
      /* ----------------------------------------------------------------- */
      text = text.replace(/\n/g, (match, offset, full) => {
        // On regarde ce qui précède immédiatement le saut de ligne
        const before = full.slice(0, offset);
        // Si la ligne se termine par une balise de bloc fermée, pas de <br>
        if (/(<\/div>|<\/ul>|<\/ol>|<\/li>)\s*$/.test(before)) {
          return "";
        }
        return "<br>";
      });

      return text;
    }

    /* ===================================================================== */
    /*  RENDU & MISE À JOUR DE L'APERÇU                                      */
    /* ===================================================================== */
    function updatePreview() {
      const raw = editor.value;

      // 1) Mise à jour du compteur de caractères
      const len = raw.length;
      charCounter.textContent = `${len} / ${MAX_CHARS}`;
      charCounter.classList.toggle("text-red-400", len > MAX_CHARS);
      charCounter.classList.toggle("text-discord-muted", len <= MAX_CHARS);

      // 2) Bannière Nitro si dépassement
      nitroBanner.classList.toggle("hidden", len <= MAX_CHARS);

      // 3) Parsing & injection du HTML
      preview.innerHTML = parseDiscordMarkdown(raw);

      // 4) Activation des spoilers cliquables
      preview.querySelectorAll(".discord-spoiler").forEach((el) => {
        el.addEventListener("click", function () {
          this.classList.add("revealed");
        });
      });
    }

    /* ===================================================================== */
    /*  BARRE D'OUTILS : insertion de syntaxe à l'emplacement du curseur     */
    /* ===================================================================== */
    function wrapSelection(before, after = before, placeholder = "texte") {
      const start = editor.selectionStart;
      const end   = editor.selectionEnd;
      const value = editor.value;
      const selected = value.slice(start, end) || placeholder;

      const newText = value.slice(0, start) + before + selected + after + value.slice(end);
      editor.value = newText;

      // Repositionnement du curseur autour du texte inséré
      const cursorStart = start + before.length;
      editor.focus();
      editor.setSelectionRange(cursorStart, cursorStart + selected.length);

      updatePreview();
    }

    function insertText(textToInsert) {
      const start = editor.selectionStart;
      const value = editor.value;
      editor.value = value.slice(0, start) + textToInsert + value.slice(editor.selectionEnd);
      const newPos = start + textToInsert.length;
      editor.focus();
      editor.setSelectionRange(newPos, newPos);
      updatePreview();
    }

    // Association des actions aux boutons de la barre d'outils
    document.querySelectorAll(".toolbar-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        switch (action) {
          case "bold":      wrapSelection("**"); break;
          case "italic":    wrapSelection("*"); break;
          case "underline": wrapSelection("__"); break;
          case "strike":    wrapSelection("~~"); break;
          case "code":      wrapSelection("`"); break;
          case "codeblock": wrapSelection("```js\n", "\n```", "votre code"); break;
          case "spoiler":   wrapSelection("||"); break;
          case "quote":     insertText("> "); break;
          case "timestamp": {
            // Insère un timestamp relatif basé sur l'heure actuelle
            const now = Math.floor(Date.now() / 1000);
            insertText(`<t:${now}:R>`);
            break;
          }
        }
      });
    });

    /* ===================================================================== */
    /*  TRONCATURE AUTOMATIQUE À 2000 CARACTÈRES                            */
    /* ===================================================================== */
    truncateBtn.addEventListener("click", () => {
      editor.value = editor.value.slice(0, MAX_CHARS);
      updatePreview();
      editor.focus();
    });

    /* ===================================================================== */
    /*  PERSONNALISATION DE L'UTILISATEUR (pseudo & avatar)                 */
    /* ===================================================================== */
    usernameInput.addEventListener("input", () => {
      previewUser.textContent = usernameInput.value || "Utilisateur";
    });
    avatarInput.addEventListener("input", () => {
      const url = avatarInput.value.trim();
      if (url) previewAvatar.src = url;
    });

    /* ===================================================================== */
    /*  HORLOGE DU MESSAGE (heure actuelle)                                  */
    /* ===================================================================== */
    (function setMessageTime() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("preview-time").textContent = `aujourd'hui à ${hh}:${mm}`;
    })();

    /* ===================================================================== */
    /*  ÉCOUTEUR PRINCIPAL & CONTENU DE DÉMONSTRATION                        */
    /* ===================================================================== */
    editor.addEventListener("input", updatePreview);

    // Exemple pré-rempli pour montrer toutes les fonctionnalités au chargement
    editor.value = `# Bienvenue dans l'éditeur Discord ! 🎉
Voici une démonstration de **gras**, *italique*, __souligné__, ~~barré~~ et ***tout combiné***.

Un petit ||spoiler cliquable|| juste ici, et du \`code en ligne\` aussi.

> Ceci est une citation simple
> sur plusieurs lignes

\`\`\`python
def hello():
    print("Bonjour Discord !")
    return 42
\`\`\``;

    // Rendu initial
    updatePreview();
  </script>
